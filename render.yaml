services:
  - type: web
    name: dynamicrestobar-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 24h
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      - key: FRONTEND_URL_POS
        value: https://dynamic-resto-bar.vercel.app
      - key: FRONTEND_URL_KDS
        value: https://dynamic-resto-bar.vercel.app
      - key: FRONTEND_URL_ADMIN
        value: https://dynamic-resto-bar.vercel.app
      - key: LOG_LEVEL
        value: info
      - key: APP_TIMEZONE
        value: America/Bogota
